<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Reader - Library Management System</title>
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/main.css}">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-content">
            <h1>Library Management System</h1>
            <p class="subtitle">Professional Book and Reader Management</p>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/books" class="nav-link">📚 All Books</a>
            <a href="/books/search" class="nav-link">🔍 Search Books</a>
            <a href="/books/new" class="nav-link">➕ Add Book</a>
            <a href="/people" class="nav-link">👥 All Readers</a>
            <a href="/people/new" class="nav-link">👤 Add Reader</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <h2 class="page-title">Edit Reader Details</h2>

        <!-- Form Container -->
        <div class="form-container fade-in">
            <form th:method="PATCH" 
                  th:action="@{/people/{id}(id=${person.getId()})}" 
                  th:object="${person}">
                
                <div class="form-group">
                    <label for="fio" class="form-label">👤 Full Name *</label>
                    <input type="text" 
                           th:field="*{fio}" 
                           id="fio" 
                           class="form-input"
                           placeholder="Enter reader's full name"
                           required/>
                    <div th:if="${#fields.hasErrors('fio')}" 
                         th:errors="*{fio}" 
                         class="error-message">Name error</div>
                </div>

                <div class="form-group">
                    <label for="year_of_birth" class="form-label">📅 Year of Birth *</label>
                    <input type="number" 
                           th:field="*{year_of_birth}" 
                           id="year_of_birth" 
                           class="form-input"
                           placeholder="Enter birth year"
                           min="1900"
                           max="2024"
                           required/>
                    <div th:if="${#fields.hasErrors('year_of_birth')}" 
                         th:errors="*{year_of_birth}" 
                         class="error-message">Birth year error</div>
                </div>

                <div class="btn-group text-center">
                    <input type="submit" value="Update Reader" class="btn btn-primary"/>
                    <a th:href="@{/people/{id}(id=${person.getId()})}" class="btn btn-secondary">View Reader</a>
                    <a href="/people" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Current Reader Info -->
        <div class="card mt-xl">
            <h4>📋 Current Reader Information</h4>
            <div class="item-meta">
                <p><strong>Reader ID:</strong> <span th:text="${person.getId()}">ID</span></p>
                <p><strong>Registration Date:</strong> N/A</p>
                <p><strong>Last Modified:</strong> Today</p>
            </div>
        </div>
    </div>

    <script type="text/javascript" th:src="@{/static/js/main.js}"></script>
</body>
</html>
